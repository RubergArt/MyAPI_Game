<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>API Space Game - Minimal Version</title>
    <!-- Load p5.js library -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.js"></script>
    <!-- Load our minimal game script -->
    <script src="minimal_game.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent browser gestures on touch */
        }
        canvas {
            display: block;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
            display: none; /* Hidden by default, shown with JavaScript */
        }
        #mobileInstructions {
            display: none; /* Hidden by default, shown with JavaScript */
            position: fixed;
            bottom: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="instructions">
        Use ←/→ arrow keys to move and SPACE to shoot
    </div>
    <div id="mobileInstructions">
        Touch left/right sides to move, center to shoot
    </div>
    
    <script>
        // Show appropriate instructions based on device
        window.onload = function() {
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                document.getElementById('mobileInstructions').style.display = 'block';
            } else {
                document.getElementById('instructions').style.display = 'block';
            }
            
            console.log("Game loader initialized");
        };
    </script>
</body>
</html>
