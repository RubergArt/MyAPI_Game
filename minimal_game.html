<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal HR API Game</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="instructions">
        Use ←/→ arrow keys to move and SPACE to shoot
    </div>
    
    <script>
        // Minimal P5.js Game Code
        let gameState = "splash"; // splash, playing, won, lost
        let canvasWidth = 800;
        let canvasHeight = 600;
        
        function setup() {
            createCanvas(canvasWidth, canvasHeight);
            textAlign(CENTER, CENTER);
        }
        
        function draw() {
            background(20);
            
            if (gameState === "splash") {
                drawSplashScreen();
            } else if (gameState === "playing") {
                drawPlayingScreen();
            } else if (gameState === "won") {
                drawWonScreen();
            }
        }
        
        function drawSplashScreen() {
            fill(255);
            textSize(32);
            text("HR API Game", width/2, height/3);
            
            textSize(18);
            text("Press ENTER to start", width/2, height/2);
            
            // Draw stars for background effect
            for (let i = 0; i < 50; i++) {
                let x = random(width);
                let y = random(height);
                let size = random(1, 3);
                fill(255, 255, 255, random(100, 255));
                ellipse(x, y, size, size);
            }
        }
        
        function drawPlayingScreen() {
            // Draw player
            fill(0, 255, 0);
            rect(width/2 - 25, height - 50, 50, 30);
            
            // Draw some "API" targets
            fill(255, 0, 0);
            for (let i = 0; i < 5; i++) {
                ellipse(100 + i * 150, 100, 40, 40);
                fill(255);
                textSize(14);
                text("API", 100 + i * 150, 100);
                fill(255, 0, 0);
            }
        }
        
        function drawWonScreen() {
            fill(0, 255, 0);
            textSize(32);
            text("You Won!", width/2, height/3);
            
            textSize(18);
            text("Press ENTER to play again", width/2, height/2);
        }
        
        function keyPressed() {
            if (keyCode === ENTER) {
                if (gameState === "splash") {
                    gameState = "playing";
                } else if (gameState === "won") {
                    gameState = "splash";
                }
            }
            
            // Secret win button for testing
            if (keyCode === 87) { // 'W' key
                gameState = "won";
            }
        }
        
        function mousePressed() {
            // Click to start
            if (gameState === "splash") {
                gameState = "playing";
            }
        }
    </script>
</body>
</html>
