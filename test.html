<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <script src="test.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: white;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            max-width: 600px;
            text-align: center;
        }
        a {
            color: #4CAF50;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .test-links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .test-links a {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>GitHub Pages Test</h1>
    <p>If you can see this page, GitHub Pages is working correctly for static HTML files.</p>
    
    <div class="test-links">
        <a href="index.html">Go to the game</a>
        <a href="p5test.html">Test p5.js functionality</a>
        <a href="https://rubergart.github.io/MyAPI_Game/sketch.js" target="_blank">View sketch.js file</a>
    </div>
    
    <div id="js-status" style="margin-top: 20px; padding: 10px; background-color: #f44336; color: white; border-radius: 5px;">
        JavaScript status: If you see this message, JavaScript is NOT running properly.
    </div>
    
    <script>
        // This will run if inline JavaScript works
        document.getElementById('js-status').style.backgroundColor = '#4CAF50';
        document.getElementById('js-status').textContent = 'JavaScript status: Inline JavaScript is working!';
    </script>
</body>
</html>
