<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>API Space Game</title>
    <!-- Load p5.js library -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent browser gestures on touch */
        }
        canvas {
            display: block;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
            display: none; /* Hidden by default, shown with JavaScript */
        }
        #mobileInstructions {
            display: none; /* Hidden by default, shown with JavaScript */
            position: fixed;
            bottom: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
        }
        #loadingMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 18px;
            z-index: 100;
        }
        #errorMessage {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6666;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 16px;
            max-width: 80%;
            display: none;
            z-index: 100;
        }
        #minimalGameLink {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #66ccff;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
            display: none;
            z-index: 100;
        }
    </style>
    
    <!-- Ensure game script loads after HTML structure is ready -->
    <script>
        // Hide loading message when setup is complete
        window.gameSetupComplete = false;
        window.hideLoadingMessages = function() {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('minimalGameLink').style.display = 'none';
            window.gameSetupComplete = true;
        };
    </script>
    
    <!-- Load our sketch file -->
    <script src="sketch.js"></script>
</head>
<body>
    <div id="loadingMessage">Loading game...</div>
    <div id="errorMessage">There was a problem loading the game.</div>
    <div id="minimalGameLink" onclick="window.location.href='minimal_game.html'">Play the minimal version instead</div>
    
    <div id="instructions">
        Use ←/→ arrow keys to move and SPACE to shoot
    </div>
    <div id="mobileInstructions">
        Touch left/right sides to move, center to shoot
    </div>
    
    <script>
        // Show appropriate instructions based on device
        window.onload = function() {
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                document.getElementById('mobileInstructions').style.display = 'block';
            } else {
                document.getElementById('instructions').style.display = 'block';
            }
            
            console.log("Game loader initialized");
        };
        
        // Fallback timer - if game doesn't start within 5 seconds, show error and minimal game link
        setTimeout(function() {
            // Check if p5 canvas exists AND setup is complete
            if (document.getElementsByTagName('canvas').length === 0 || !window.gameSetupComplete) {
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('minimalGameLink').style.display = 'block';
                console.error("Game failed to load - no canvas detected or setup didn't complete after timeout");
            }
        }, 5000);
    </script>
</body>
</html>
