<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>API Space Game</title>
    <!-- Load p5.js library -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent browser gestures on touch */
        }
        canvas {
            display: block;
            position: relative;
            z-index: 10; /* Make sure canvas is above other elements */
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
            display: none; /* Hidden by default, shown with JavaScript */
        }
        #mobileInstructions {
            display: none; /* Hidden by default, shown with JavaScript */
            position: fixed;
            bottom: 20px;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
        }
        /* Ultra-aggressive error message hiding */
        .hidden-permanently,
        #loadingMessage, 
        #errorMessage, 
        #minimalGameLink,
        [id*="error"],
        [id*="Error"],
        [class*="error"],
        [class*="Error"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            overflow: hidden !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
            z-index: -999 !important;
            pointer-events: none !important;
        }
        #loadingMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 18px;
            z-index: 1000; /* Higher z-index to ensure it's on top */
        }
        #errorMessage {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6666;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 16px;
            max-width: 80%;
            display: none;
            z-index: 1000; /* Higher z-index to ensure it's on top */
        }
        #minimalGameLink {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #66ccff;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
            display: none;
            z-index: 1000; /* Higher z-index to ensure it's on top */
        }
    </style>
    
    <!-- Ensure game script loads after HTML structure is ready -->
    <script>
        // Ultra-aggressive error handling
        window.onerror = function(msg, url, line) {
            console.log("Caught error:", msg, "at", url, ":", line);
            // Prevent default error handling
            return true; 
        };
        
        // Game setup and loading state tracking
        window.gameSetupComplete = false;
        window.gameLoading = true;
        
        // Improved hideLoadingMessages function with logging
        window.hideLoadingMessages = function() {
            console.log("hideLoadingMessages called");
            
            // Find all elements (with error handling)
            var loadingEl = document.getElementById('loadingMessage');
            var errorEl = document.getElementById('errorMessage');
            var minimalEl = document.getElementById('minimalGameLink');
            
            // Hide them all and add a special class to ensure they stay hidden
            if (loadingEl) {
                loadingEl.style.display = 'none';
                loadingEl.classList.add('hidden-permanently');
            }
            if (errorEl) {
                errorEl.style.display = 'none';
                errorEl.classList.add('hidden-permanently');
            }
            if (minimalEl) {
                minimalEl.style.display = 'none';
                minimalEl.classList.add('hidden-permanently');
            }
            
            // Mark game as loaded
            window.gameSetupComplete = true;
            window.gameLoading = false;
            
            console.log("All loading messages hidden, game marked as setup complete");
            
            // Prevent any future manipulation of these elements
            window.gameMessagesHidden = true;
        };
        
        // More aggressive - apply immediately
        document.write('<style>#loadingMessage, #errorMessage, #minimalGameLink { display: none !important; }</style>');
        
        // Override any DOM method that might show the error messages once game is loaded
        window.addEventListener('load', function() {
            // Apply ultra-aggressive CSS immediately
            var style = document.createElement('style');
            style.textContent = '#loadingMessage, #errorMessage, #minimalGameLink, .p5Canvas { pointer-events: auto !important; } body > div:not(#instructions):not(#mobileInstructions) { display: none !important; }';
            document.head.appendChild(style);
            
            // Wait until game has fully initialized
            setTimeout(function() {
                if (window.gameSetupComplete) {
                    // Get references to all message elements
                    const msgs = [
                        document.getElementById('loadingMessage'),
                        document.getElementById('errorMessage'),
                        document.getElementById('minimalGameLink')
                    ];
                    
                    // Apply permanent hiding
                    msgs.forEach(function(el) {
                        if (el) {
                            // Override style.display setter
                            Object.defineProperty(el.style, 'display', {
                                get: function() { return 'none'; },
                                set: function() { console.log('Blocked attempt to show message'); }
                            });
                            
                            // Add class
                            el.classList.add('hidden-permanently');
                        }
                    });
                    
                    console.log("Applied permanent message hiding protection");
                }
            }, 3000); // Give the game 3 seconds to initialize fully
        });
        
        // Directly attach to the document for additional reliability
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded, attaching p5 ready check");
            
            // Check if p5 is ready every 100ms
            var p5ReadyCheck = setInterval(function() {
                if (window.p5) {
                    console.log("p5 detected as ready");
                    clearInterval(p5ReadyCheck);
                }
            }, 100);
        });
    </script>
    
    <!-- Load our sketch file -->
    <script src="sketch.js"></script>
</head>
<body>
    <div id="loadingMessage">Loading game...</div>
    <div id="errorMessage">There was a problem loading the game.</div>
    <div id="minimalGameLink" onclick="window.location.href='minimal_game.html'">Play the minimal version instead</div>
    
    <div id="instructions">
        Use ←/→ arrow keys to move and SPACE to shoot
    </div>
    <div id="mobileInstructions">
        Touch left/right sides to move, center to shoot
    </div>
    
    <script>
        // Hide all possible error messages as soon as possible
        (function() {
            var hideMsg = function() {
                var loadMsg = document.getElementById('loadingMessage');
                var errorMsg = document.getElementById('errorMessage');
                var minLink = document.getElementById('minimalGameLink');
                
                if (loadMsg) loadMsg.className += ' hidden-permanently';
                if (errorMsg) errorMsg.className += ' hidden-permanently';
                if (minLink) minLink.className += ' hidden-permanently';
            };
            
            // Try to hide immediately
            hideMsg();
            
            // Try again after a short delay
            setTimeout(hideMsg, 100);
            setTimeout(hideMsg, 500);
            setTimeout(hideMsg, 1000);
        })();
        
        // Show appropriate instructions based on device
        window.onload = function() {
            console.log("Window loaded");
            
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                document.getElementById('mobileInstructions').style.display = 'block';
            } else {
                document.getElementById('instructions').style.display = 'block';
            }
            
            console.log("Game loader initialized");
            
            // Try to clear messages if game is already loaded (rare race condition)
            if (window.gameSetupComplete) {
                window.hideLoadingMessages();
            }
        };
        
        // Improved fallback timer - checks multiple times if game doesn't start
        var loadingChecks = 0;
        var maxLoadingChecks = 3;
        
        function checkGameLoaded() {
            loadingChecks++;
            console.log("Checking if game loaded (attempt " + loadingChecks + ")");
            
            // Check if p5 canvas exists AND setup is complete
            var canvasExists = document.getElementsByTagName('canvas').length > 0;
            
            if (canvasExists && window.gameSetupComplete) {
                console.log("Game confirmed as loaded - canvas found and setup complete");
                window.hideLoadingMessages();
                
                // Once confirmed loaded, apply additional CSS to force hide messages
                var style = document.createElement('style');
                style.textContent = '#loadingMessage, #errorMessage, #minimalGameLink { display: none !important; }';
                document.head.appendChild(style);
            } else if (loadingChecks >= maxLoadingChecks) {
                console.error("Game failed to load after " + maxLoadingChecks + " attempts");
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('minimalGameLink').style.display = 'block';
            } else {
                // Schedule another check in 2 seconds
                setTimeout(checkGameLoaded, 2000);
            }
        }
        
        // Start checking after 2 seconds
        setTimeout(checkGameLoaded, 2000);
    </script>
</body>
</html>
